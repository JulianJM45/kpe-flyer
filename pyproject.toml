[project]
name = "kpe-flyer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JulianJM45", email = "julian@clami.net" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "python-fasthtml>=0.14.12",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",  # für TestClient in tests/test_ui.py
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
kpe-flyer = "kpe_flyer:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
