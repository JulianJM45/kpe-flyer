[project]
name = "kpe-flyer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JulianJM45", email = "julian@clami.net" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "python-fasthtml>=0.14.12",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
kpe-flyer = "kpe_flyer:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
